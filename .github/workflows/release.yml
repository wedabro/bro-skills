name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          pytest -q

  binaries:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: bro-skills-linux-x86_64
          - os: windows-latest
            asset: bro-skills-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Linux standalone executable on an older glibc baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src" -w /src python:3.12-slim-bullseye sh -c '
            apt-get update -qq &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq binutils >/dev/null &&
            python -m pip install --disable-pip-version-check . pyinstaller >/dev/null &&
            pyinstaller --clean --onefile --name "${{ matrix.asset }}" bro_skills/__main__.py
          '
          "./dist/${{ matrix.asset }}" version
      - name: Build Windows standalone executable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          pyinstaller --clean --onefile --name "${{ matrix.asset }}" bro_skills/__main__.py
          "./dist/${{ matrix.asset }}" version
      - name: Create Linux checksum
        if: runner.os == 'Linux'
        run: sha256sum "dist/${{ matrix.asset }}" > "dist/${{ matrix.asset }}.sha256"
      - name: Create Windows checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/${{ matrix.asset }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.asset }}" | Set-Content "dist/${{ matrix.asset }}.sha256" -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256

  release:
    runs-on: ubuntu-latest
    needs: binaries
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Python distributions
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/* release-assets/* --generate-notes
      - name: Discord Notification
        if: always() && env.DISCORD_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "import os, urllib.request, json; req = urllib.request.Request(os.environ['DISCORD_WEBHOOK_URL'], data=json.dumps({'content': 'New bro-skills release: ${{ github.ref_name }} (${{ job.status }})'}).encode(), headers={'Content-Type': 'application/json'}); urllib.request.urlopen(req)"
